<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neural Network Explorer — MLPRegressor</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0B1120; color: #F8FAFC; }
  input[type="range"] { -webkit-appearance: none; appearance: none; height: 8px; border-radius: 4px; outline: none; cursor: pointer; }
  input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 20px; height: 20px; border-radius: 50%; background: #14B8A6; border: 2px solid #0B1120; cursor: pointer; }
  input[type="range"]::-moz-range-thumb { width: 20px; height: 20px; border-radius: 50%; background: #14B8A6; border: 2px solid #0B1120; cursor: pointer; }
  .card { background: #1A2744; border-radius: 12px; padding: 16px; }
  .section { background: #111B2E; border-radius: 12px; padding: 20px; margin-bottom: 16px; }
  .node { border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'Consolas', 'Monaco', monospace; font-weight: bold; font-size: 12px; border: 2px solid; background: #1A2744; }
  .step-badge { width: 28px; height: 28px; border-radius: 50%; background: #14B8A6; color: #0B1120; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; flex-shrink: 0; }
  .tab-btn { padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: bold; cursor: pointer; border: 1px solid #334155; background: #1A2744; color: #94A3B8; transition: all 0.2s; }
  .tab-btn.active { background: #14B8A6; color: #0B1120; border-color: #14B8A6; }
  .tab-btn:hover:not(.active) { border-color: #14B8A6; color: #14B8A6; }
  .mono { font-family: 'Consolas', 'Monaco', monospace; }
  .explain { font-size: 13px; color: #CBD5E1; line-height: 1.6; margin-bottom: 16px; }
  .explain strong { color: #F8FAFC; }
  .explain .hl { color: #14B8A6; font-weight: 600; }
  .explain .warn { color: #FBBF24; }
  .explain .orange { color: #F97316; }
  .callout { background: #1A2744; border-left: 3px solid #14B8A6; border-radius: 0 8px 8px 0; padding: 10px 14px; margin-bottom: 16px; font-size: 13px; color: #CBD5E1; line-height: 1.5; }
  .callout.warn-callout { border-left-color: #FBBF24; }
  .callout strong { color: #F8FAFC; }
  .lock-icon { display: inline-block; font-size: 11px; margin-right: 3px; }
  .training-banner { background: linear-gradient(135deg, #1A2744, #0D3330); border: 1px solid #14B8A6; border-radius: 12px; padding: 20px; margin-bottom: 20px; text-align: center; }
  .frozen-bar { background: #0D3330; border: 1px solid #14B8A6; border-radius: 8px; padding: 10px 16px; display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 20px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo } = React;

// ── FIXED weights & biases (these are "learned" and frozen) ──
// Hidden neuron 2 has negative feature weights + high bias → activates for SMALL houses
// Other neurons have positive weights → activate for LARGE houses
const HIDDEN_WEIGHTS = [
  [0.50,  0.10,  0.10,  0.20],
  [0.10,  0.40,  0.35,  0.10],
  [-0.40, -0.10, -0.10, -0.30],
  [0.30,  0.25,  0.20,  0.25],
  [0.15, -0.10,  0.10,  0.45],
];
const HIDDEN_BIASES = [0.60, 0.50, 0.50, 0.10, 0.40];
const OUTPUT_WEIGHTS = [0.38, 0.22, -1.40, 0.15, 0.32];
const OUTPUT_BIAS = 0.10;
const FEATURE_STATS = [
  { mean: 2000, std: 800 },
  { mean: 3, std: 1.2 },
  { mean: 2, std: 1 },
  { mean: 1985, std: 30 },
];
const PRICE_SCALE = 380000;
const PRICE_OFFSET = 100000;

function scale(val, idx) { return (val - FEATURE_STATS[idx].mean) / FEATURE_STATS[idx].std; }
function relu(x) { return Math.max(0, x); }
function sigmoid(x) { return 1 / (1 + Math.exp(-x)); }

function forwardPass(features) {
  const scaled = features.map((v, i) => scale(v, i));
  const hiddenRaw = HIDDEN_WEIGHTS.map((ws, j) =>
    ws.reduce((acc, w, i) => acc + w * scaled[i], 0) + HIDDEN_BIASES[j]
  );
  const hiddenActivated = hiddenRaw.map(relu);
  const outputRaw = OUTPUT_WEIGHTS.reduce((acc, w, i) => acc + w * hiddenActivated[i], 0) + OUTPUT_BIAS;
  const outputSig = sigmoid(outputRaw);
  const price = outputSig * PRICE_SCALE + PRICE_OFFSET;
  return { scaled, hiddenRaw, hiddenActivated, outputRaw, outputSig, price };
}

function valColor(v) { return v > 0 ? "#22C55E" : v < 0 ? "#EF4444" : "#64748B"; }

function StepBadge({ num, title }) {
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 8 }}>
      <div className="step-badge">{num}</div>
      <span style={{ color: "#F8FAFC", fontWeight: "bold", fontSize: 18 }}>{title}</span>
    </div>
  );
}

function App() {
  const [sqft, setSqft] = useState(1800);
  const [beds, setBeds] = useState(3);
  const [baths, setBaths] = useState(2);
  const [year, setYear] = useState(2005);
  const [activeStep, setActiveStep] = useState(null);

  const features = [sqft, beds, baths, year];
  const result = useMemo(() => forwardPass(features), [sqft, beds, baths, year]);
  const featureNames = ["Sq. Ft.", "Beds", "Baths", "Year"];

  const sliderDefs = [
    { label: "Square Footage", value: sqft, set: setSqft, min: 600, max: 5000, step: 50, fmt: v => v.toLocaleString() + " sqft" },
    { label: "Bedrooms", value: beds, set: setBeds, min: 1, max: 6, step: 1, fmt: v => v },
    { label: "Bathrooms", value: baths, set: setBaths, min: 1, max: 5, step: 1, fmt: v => v },
    { label: "Year Built", value: year, set: setYear, min: 1920, max: 2025, step: 1, fmt: v => v },
  ];

  const steps = [
    { num: 1, title: "Feature Scaling", key: "scale" },
    { num: 2, title: "Input Layer", key: "input" },
    { num: 3, title: "Hidden Layer", key: "hidden" },
    { num: 4, title: "ReLU Activation", key: "relu" },
    { num: 5, title: "Output Layer", key: "output" },
  ];

  const show = (key) => activeStep === null || activeStep === key;

  return (
    <div style={{ maxWidth: 920, margin: "0 auto", padding: 16 }}>
      {/* Header */}
      <div style={{ textAlign: "center", marginBottom: 16 }}>
        <h1 style={{ fontSize: 32, fontWeight: "bold", marginBottom: 4 }}>Neural Network Explorer</h1>
        <p style={{ fontSize: 14, color: "#14B8A6" }}>Watch data flow through a trained MLPRegressor — one forward pass at a time</p>
      </div>

      {/* ── TRAINING CONTEXT BANNER ── */}
      <div className="training-banner">
        <div style={{ fontSize: 20, marginBottom: 6 }}>
          <span style={{ marginRight: 8 }}>&#129504;</span>
          <strong>This model has already been trained.</strong>
        </div>
        <p style={{ fontSize: 13, color: "#94A3B8", maxWidth: 700, margin: "0 auto", lineHeight: 1.6 }}>
          During training, the network saw <strong style={{ color: "#F8FAFC" }}>100,000 houses</strong> and adjusted its weights thousands of times using backpropagation and gradient descent to minimize prediction errors.
          That training phase is finished. The weights are now <strong style={{ color: "#14B8A6" }}>frozen</strong> — they will never change again. What you're doing below is <strong style={{ color: "#F97316" }}>using the trained model to predict</strong> on a new house it has never seen before. This is called <strong style={{ color: "#F8FAFC" }}>inference</strong> — a single forward pass through the network with fixed weights.
        </p>
      </div>

      {/* ── FROZEN WEIGHTS BANNER ── */}
      <div className="frozen-bar">
        <span style={{ fontSize: 16 }}>&#128274;</span>
        <span style={{ fontSize: 13, fontWeight: "bold", color: "#14B8A6" }}>WEIGHTS ARE FROZEN</span>
        <span style={{ fontSize: 12, color: "#94A3B8" }}>— Changing the sliders sends new data through fixed weights. The model is not re-learning.</span>
      </div>

      {/* ── SLIDERS: NEW HOUSE ── */}
      <div className="card" style={{ marginBottom: 20 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 4 }}>
          <span style={{ fontSize: 16 }}>&#127968;</span>
          <span style={{ fontSize: 11, fontWeight: "bold", letterSpacing: 2, color: "#14B8A6", textTransform: "uppercase" }}>New House (Never Seen During Training)</span>
        </div>
        <p style={{ fontSize: 12, color: "#64748B", marginBottom: 12 }}>
          Imagine a house just came on the market. You know these 4 facts about it. The trained model will predict its price.
        </p>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "12px 24px" }}>
          {sliderDefs.map((s, i) => (
            <div key={i}>
              <div style={{ display: "flex", justifyContent: "space-between", fontSize: 14, marginBottom: 4 }}>
                <span style={{ color: "#CBD5E1" }}>{s.label}</span>
                <span className="mono" style={{ fontWeight: "bold", color: "#22D3EE" }}>{s.fmt(s.value)}</span>
              </div>
              <input
                type="range" min={s.min} max={s.max} step={s.step} value={s.value}
                onChange={e => s.set(Number(e.target.value))}
                style={{ width: "100%", background: `linear-gradient(to right, #14B8A6 ${((s.value - s.min) / (s.max - s.min)) * 100}%, #334155 ${((s.value - s.min) / (s.max - s.min)) * 100}%)` }}
              />
            </div>
          ))}
        </div>
      </div>

      {/* Step tabs */}
      <div style={{ display: "flex", gap: 8, marginBottom: 16, flexWrap: "wrap" }}>
        <button className={`tab-btn ${activeStep === null ? "active" : ""}`} onClick={() => setActiveStep(null)}>Full Pipeline</button>
        {steps.map(s => (
          <button key={s.key} className={`tab-btn ${activeStep === s.key ? "active" : ""}`} onClick={() => setActiveStep(s.key)}>
            {s.num}. {s.title}
          </button>
        ))}
      </div>

      {/* ══════════════════════════════════════ */}
      {/* STEP 1: SCALING */}
      {/* ══════════════════════════════════════ */}
      {show("scale") && (
        <div className="section">
          <StepBadge num={1} title="Feature Scaling (StandardScaler)" />
          <div className="explain">
            Our four features are on <strong>wildly different scales</strong>. Square footage could be 1,500 while bedrooms is just 3. If we fed these raw numbers in, the network would think square footage is hundreds of times more important simply because it's a bigger number — not because it actually matters more.
          </div>
          <div className="explain">
            <span className="hl">StandardScaler</span> fixes this by transforming each feature: subtract the average value (mean), then divide by how spread out the values are (standard deviation). The result is that every feature ends up <strong>centered around zero</strong>, typically between -2 and +2. Now the network can fairly judge how much each feature actually matters.
          </div>
          <div className="callout">
            <strong>Key idea:</strong> Scaling doesn't change what the data means — it just puts all features on equal footing so the network can compare apples to apples.
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 12 }}>
            {featureNames.map((name, i) => (
              <div key={i} className="card" style={{ textAlign: "center" }}>
                <div style={{ fontSize: 12, color: "#94A3B8", marginBottom: 4 }}>{name}</div>
                <div className="mono" style={{ fontSize: 14, color: "#F97316", marginBottom: 8 }}>{features[i].toLocaleString()}</div>
                <div style={{ fontSize: 18, color: "#64748B" }}>↓</div>
                <div className="mono" style={{ fontSize: 14, fontWeight: "bold", color: valColor(result.scaled[i]), marginTop: 4 }}>
                  {result.scaled[i].toFixed(3)}
                </div>
                <div style={{ fontSize: 10, color: "#475569", marginTop: 4 }}>
                  ({features[i]} − {FEATURE_STATS[i].mean}) / {FEATURE_STATS[i].std}
                </div>
              </div>
            ))}
          </div>
          <div className="callout warn-callout" style={{ marginTop: 12 }}>
            <strong>Try it:</strong> Drag Square Footage to 2,000 (the mean). Its scaled value becomes ~0.00 — right at center. Now drag it to 3,000 — it goes positive, meaning "above average." Drag it to 600 — it goes negative, meaning "below average." That's all scaling does.
          </div>
        </div>
      )}

      {/* ══════════════════════════════════════ */}
      {/* STEP 2: INPUT LAYER */}
      {/* ══════════════════════════════════════ */}
      {show("input") && (
        <div className="section">
          <StepBadge num={2} title="Input Layer" />
          <div className="explain">
            The input layer is the <strong>entry point</strong> of the network. It has exactly <span className="hl">one node for each feature</span> — since we have 4 features, we have 4 input nodes. That's it.
          </div>
          <div className="explain">
            These nodes <strong>don't do any math at all</strong>. They don't transform or process the data. They simply receive the scaled values and pass them forward to the hidden layer. Think of them as <strong>loading docks</strong> at a factory — the raw materials arrive here, but the actual work happens inside.
          </div>
          <div className="callout">
            <strong>Why show this step?</strong> Because the structure of the input layer is determined entirely by your data. If you had 10 features about each house, you'd have 10 input nodes. 50 features = 50 nodes. The network shapes itself to match your dataset.
          </div>
          <div style={{ display: "flex", justifyContent: "center", gap: 24, marginTop: 8 }}>
            {featureNames.map((name, i) => (
              <div key={i} style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 4 }}>
                <div style={{ fontSize: 12, color: "#94A3B8" }}>{name}</div>
                <div className="node" style={{ width: 56, height: 56, borderColor: valColor(result.scaled[i]), color: valColor(result.scaled[i]) }}>
                  {result.scaled[i].toFixed(2)}
                </div>
                <div style={{ fontSize: 10, color: "#475569" }}>passes through</div>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* ══════════════════════════════════════ */}
      {/* STEP 3: HIDDEN LAYER */}
      {/* ══════════════════════════════════════ */}
      {show("hidden") && (
        <div className="section">
          <StepBadge num={3} title="Hidden Layer — Weighted Sums" />
          <div className="explain">
            This is where the real work happens. Each hidden node is <strong>connected to every input node</strong>, meaning each one receives all 4 feature values. But here's the key — each hidden node has its own unique set of <span className="hl">weights</span> that it multiplies each input by.
          </div>
          <div className="explain">
            A <strong>weight</strong> controls how much attention a node pays to a particular feature. A large positive weight (like <span style={{color:"#A78BFA"}}>0.80</span>) means "this feature is important and pushes my output higher." A negative weight (like <span style={{color:"#A78BFA"}}>-0.30</span>) means "this feature pushes my output lower." A weight near zero means "I mostly ignore this."
          </div>
          <div className="explain">
            After multiplying each input by its weight and adding them up, the node adds a <span className="hl">bias</span> — a baseline offset that lets the node shift its output up or down regardless of the inputs. Think of it like a base land value before you even consider the house.
          </div>
          <div className="callout">
            <span className="lock-icon">&#128274;</span> <strong>Remember:</strong> These <span style={{color:"#A78BFA"}}>purple weights</span> were learned during training and are now frozen. The network is NOT adjusting them right now — it's just using them to process your new house.
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {HIDDEN_WEIGHTS.map((ws, j) => {
              const focusDesc = [
                "Pays most attention to square footage",
                "Focuses on bedrooms and bathrooms",
                "Activates for small houses (negative weights)",
                "Balanced — weighs everything fairly evenly",
                "Cares most about year built",
              ];
              return (
                <div key={j} className="card" style={{ padding: 12 }}>
                  <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 6 }}>
                    <span style={{ color: "#14B8A6", fontWeight: "bold", fontSize: 13 }}>Hidden Node h{j+1}</span>
                    <span style={{ color: "#64748B", fontSize: 11, fontStyle: "italic" }}>{focusDesc[j]}</span>
                  </div>
                  <div style={{ display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap" }} className="mono">
                    {ws.map((w, i) => (
                      <span key={i} style={{ fontSize: 12 }}>
                        <span style={{ color: "#A78BFA" }} title={"Weight for " + featureNames[i]}>{w.toFixed(2)}</span>
                        <span style={{ color: "#64748B" }}>×</span>
                        <span style={{ color: valColor(result.scaled[i]) }}>{result.scaled[i].toFixed(2)}</span>
                        {i < ws.length - 1 && <span style={{ color: "#64748B", margin: "0 4px" }}>+</span>}
                      </span>
                    ))}
                    <span style={{ color: "#64748B", fontSize: 12 }}>+</span>
                    <span style={{ color: "#A78BFA", fontSize: 12 }} title="Bias">{HIDDEN_BIASES[j].toFixed(2)}</span>
                    <span style={{ color: "#64748B", fontSize: 12 }}>=</span>
                    <span style={{ color: valColor(result.hiddenRaw[j]), fontWeight: "bold", fontSize: 14 }}>{result.hiddenRaw[j].toFixed(3)}</span>
                  </div>
                </div>
              );
            })}
          </div>
          <div className="callout warn-callout" style={{ marginTop: 12 }}>
            <strong>Try it:</strong> Drag Square Footage way up. Watch h1 (which weighs sq ft at <span style={{color:"#A78BFA"}}>0.50</span>) react strongly, while h3 (which has a <em>negative</em> sq ft weight of <span style={{color:"#A78BFA"}}>-0.40</span>) actually decreases — it's the "small house detector." Each node has learned to "look at" the house differently.
          </div>
        </div>
      )}

      {/* ══════════════════════════════════════ */}
      {/* STEP 4: RELU */}
      {/* ══════════════════════════════════════ */}
      {show("relu") && (
        <div className="section">
          <StepBadge num={4} title="ReLU Activation" />
          <div className="explain">
            After each hidden node computes its weighted sum, the result passes through an <strong>activation function</strong> called <span className="hl">ReLU</span> (Rectified Linear Unit). The rule is dead simple: <strong>if the number is positive, it passes through unchanged. If it's negative, it becomes zero.</strong>
          </div>
          <div className="explain">
            This seems almost too simple to matter, but it's actually the <strong>key to the whole system</strong>. Without an activation function, the entire network would just be doing linear math — multiplying and adding. No matter how many layers you stacked, it could only learn straight-line relationships. It would be no better than basic linear regression.
          </div>
          <div className="explain">
            ReLU <strong>bends the math</strong>. It introduces non-linearity, which lets the network learn curved, conditional relationships like: "adding a 4th bedroom increases value, <em>unless</em> the house is under 900 sq ft, in which case the rooms are too cramped and it hurts the value." That kind of "it depends" logic requires non-linearity.
          </div>
          <div className="callout">
            <strong>Nodes that output zero are "off" for this house.</strong> They detected a pattern that doesn't apply here. Other houses might activate them. The <em>pattern</em> of which nodes fire and how strongly is the network's internal representation of this particular house.
          </div>
          <div style={{ display: "flex", justifyContent: "center", gap: 24, marginTop: 8 }}>
            {result.hiddenRaw.map((raw, j) => {
              const activated = result.hiddenActivated[j];
              const killed = raw < 0;
              return (
                <div key={j} style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 4 }}>
                  <div style={{ fontSize: 12, color: "#64748B", fontWeight: "bold" }}>h{j+1}</div>
                  <div className="mono" style={{ fontSize: 13, color: valColor(raw) }}>{raw.toFixed(2)}</div>
                  <div style={{ fontSize: 11, color: "#475569", padding: "2px 0" }}>{killed ? "negative → zero" : "positive → keep"}</div>
                  <div style={{ fontSize: 16, color: killed ? "#EF4444" : "#22C55E" }}>{killed ? "✕" : "↓"}</div>
                  <div className="node" style={{
                    width: 56, height: 56,
                    borderColor: killed ? "#EF4444" : "#22C55E",
                    color: killed ? "#EF4444" : "#22C55E",
                    background: killed ? "#1C1017" : "#0C1A12",
                    opacity: killed ? 0.5 : 1,
                    fontSize: 13,
                  }}>
                    {activated.toFixed(2)}
                  </div>
                  <div style={{ fontSize: 11, fontWeight: "bold", color: killed ? "#EF4444" : "#22C55E" }}>{killed ? "OFF" : "ON"}</div>
                </div>
              );
            })}
          </div>
          <div className="callout warn-callout" style={{ marginTop: 12 }}>
            <strong>Try it:</strong> Adjust the sliders until a node that was ON goes OFF (or vice versa). You're watching the network's "opinion" of the house change in real time — certain patterns are activating or deactivating based on the house's characteristics.
          </div>
        </div>
      )}

      {/* ══════════════════════════════════════ */}
      {/* STEP 5: OUTPUT */}
      {/* ══════════════════════════════════════ */}
      {show("output") && (
        <div className="section">
          <StepBadge num={5} title="Output Layer — Prediction" />
          <div className="explain">
            All the activated hidden node outputs now flow into <strong>one final output node</strong>. This node works the same way as the hidden nodes — it multiplies each incoming value by a weight, sums them up, and adds a bias.
          </div>
          <div className="explain">
            The raw weighted sum then passes through a <span className="hl">sigmoid activation function</span>, which squashes it into a value between 0 and 1. This naturally <strong>bounds the prediction</strong> — the network can never predict a negative price or an astronomically high one. Sigmoid is like a confidence meter: very negative inputs → near 0, very positive inputs → near 1, and the transition is a smooth S-curve.
          </div>
          <div className="explain">
            The sigmoid output is then <strong>scaled to real dollars</strong>: multiply by $380,000 (the price range) and add $100,000 (the minimum). So a sigmoid of 0.0 → $100K, sigmoid of 0.5 → $290K, sigmoid of 1.0 → $480K.
          </div>
          <div className="callout">
            <span className="lock-icon">&#128274;</span> <strong>Again — no learning is happening here.</strong> The weights are frozen. This is just multiplication and addition using the weights the network already learned. A single forward pass.
          </div>

          <div className="card" style={{ marginBottom: 16 }}>
            <div style={{ fontSize: 12, color: "#94A3B8", marginBottom: 8, fontWeight: "bold" }}>Combining hidden outputs (only ON nodes contribute):</div>
            <div className="mono" style={{ display: "flex", alignItems: "center", gap: 4, flexWrap: "wrap", fontSize: 12, marginBottom: 12 }}>
              {OUTPUT_WEIGHTS.map((w, i) => {
                const isOff = result.hiddenActivated[i] === 0;
                return (
                  <span key={i} style={{ opacity: isOff ? 0.35 : 1 }}>
                    <span style={{ color: "#A78BFA" }}>{w.toFixed(2)}</span>
                    <span style={{ color: "#64748B" }}>×</span>
                    <span style={{ color: isOff ? "#EF4444" : "#22C55E" }}>{result.hiddenActivated[i].toFixed(2)}</span>
                    {isOff && <span style={{ color: "#EF4444", fontSize: 9 }}> (off)</span>}
                    {i < OUTPUT_WEIGHTS.length - 1 && <span style={{ color: "#64748B", margin: "0 4px" }}>+</span>}
                  </span>
                );
              })}
              <span style={{ color: "#64748B" }}>+</span>
              <span style={{ color: "#A78BFA" }}>{OUTPUT_BIAS.toFixed(2)}</span>
              <span style={{ color: "#64748B" }}>=</span>
              <span style={{ fontWeight: "bold", fontSize: 14, color: "#22D3EE" }}>{result.outputRaw.toFixed(4)}</span>
              <span style={{ color: "#475569", fontSize: 11, marginLeft: 4 }}>(raw)</span>
            </div>
            <div style={{ fontSize: 13, color: "#94A3B8", marginBottom: 8 }}>
              <strong style={{ color: "#CBD5E1" }}>Sigmoid:</strong>{" "}
              σ(<span className="mono" style={{ color: "#22D3EE" }}>{result.outputRaw.toFixed(4)}</span>)
              {" = "}
              <span className="mono" style={{ color: "#14B8A6", fontWeight: "bold" }}>{result.outputSig.toFixed(4)}</span>
            </div>
            <div style={{ fontSize: 13, color: "#94A3B8" }}>
              <strong style={{ color: "#CBD5E1" }}>Scale to dollars:</strong>{" "}
              <span className="mono" style={{ color: "#14B8A6" }}>{result.outputSig.toFixed(4)}</span>
              {" × $"}{PRICE_SCALE.toLocaleString()}
              {" + $"}{PRICE_OFFSET.toLocaleString()}
            </div>
          </div>

          <div style={{ textAlign: "center" }}>
            <div style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: 2, color: "#94A3B8", marginBottom: 4 }}>Predicted Selling Price</div>
            <div className="mono" style={{ fontSize: 52, fontWeight: "bold", color: "#F97316" }}>
              ${Math.round(result.price).toLocaleString()}
            </div>
            <div style={{ fontSize: 12, color: "#64748B", marginTop: 4 }}>
              This is the network's best guess based on patterns it learned from 100,000 training houses.
            </div>
          </div>
        </div>
      )}

      {/* Footer */}
      <div style={{ textAlign: "center", marginTop: 24, fontSize: 12, color: "#475569", lineHeight: 1.6, maxWidth: 650, margin: "24px auto 0" }}>
        <strong style={{ color: "#94A3B8" }}>What you're seeing is inference (prediction), not training.</strong><br />
        The weights in this demo are pre-set to simulate a trained model. In a real MLPRegressor, these weights would have been learned automatically by seeing thousands of houses and adjusting through backpropagation and gradient descent.
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
