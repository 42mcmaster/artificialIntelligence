<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Linear Regression Explorer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0B1120; color: #F8FAFC; }
  input[type="range"] { -webkit-appearance: none; appearance: none; height: 8px; border-radius: 4px; outline: none; cursor: pointer; }
  input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 20px; height: 20px; border-radius: 50%; background: #3B82F6; border: 2px solid #0B1120; cursor: pointer; }
  input[type="range"]::-moz-range-thumb { width: 20px; height: 20px; border-radius: 50%; background: #3B82F6; border: 2px solid #0B1120; cursor: pointer; }
  .card { background: #1A2744; border-radius: 12px; padding: 16px; }
  .section { background: #111B2E; border-radius: 12px; padding: 20px; margin-bottom: 16px; }
  .mono { font-family: 'Consolas', 'Monaco', monospace; }
  .step-badge { width: 28px; height: 28px; border-radius: 50%; background: #3B82F6; color: #0B1120; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; flex-shrink: 0; }
  .explain { font-size: 13px; color: #CBD5E1; line-height: 1.6; margin-bottom: 14px; }
  .explain strong { color: #F8FAFC; }
  .explain .hl { color: #3B82F6; font-weight: 600; }
  .callout { background: #1A2744; border-left: 3px solid #3B82F6; border-radius: 0 8px 8px 0; padding: 10px 14px; margin-bottom: 14px; font-size: 13px; color: #CBD5E1; line-height: 1.5; }
  .callout.warn-callout { border-left-color: #FBBF24; }
  .callout strong { color: #F8FAFC; }
  canvas { border-radius: 8px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo, useRef, useEffect } = React;

// ── "Trained" coefficients (simulated) ──
const COEFFICIENTS = {
  sqft: 80,
  beds: 8000,
  baths: 12000,
  year: 120,
  intercept: -125000
};

const FEATURE_NAMES = ["Sq. Ft.", "Beds", "Baths", "Year"];
const COEF_KEYS = ["sqft", "beds", "baths", "year"];

function predict(sqft, beds, baths, year) {
  return COEFFICIENTS.sqft * sqft +
         COEFFICIENTS.beds * beds +
         COEFFICIENTS.baths * baths +
         COEFFICIENTS.year * year +
         COEFFICIENTS.intercept;
}

// Generate fake training scatter points
function generateScatter(n, featureIdx, sqft, beds, baths, year) {
  const points = [];
  const rng = (seed) => { let s = seed; return () => { s = (s * 16807) % 2147483647; return s / 2147483647; }; };
  const rand = rng(42);
  for (let i = 0; i < n; i++) {
    const sf = 800 + rand() * 3500;
    const bd = 1 + Math.floor(rand() * 5);
    const bt = 1 + Math.floor(rand() * 4);
    const yr = 1940 + Math.floor(rand() * 80);
    const price = predict(sf, bd, bt, yr) + (rand() - 0.5) * 120000;
    const featureVal = [sf, bd, bt, yr][featureIdx];
    points.push({ x: featureVal, y: price });
  }
  return points;
}

function StepBadge({ num, title }) {
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 8 }}>
      <div className="step-badge">{num}</div>
      <span style={{ color: "#F8FAFC", fontWeight: "bold", fontSize: 18 }}>{title}</span>
    </div>
  );
}

// ── Scatter Plot Component ──
function ScatterPlot({ points, userX, userY, xLabel, xMin, xMax }) {
  const canvasRef = useRef(null);
  const W = 440, H = 280, PAD = 50;

  useEffect(() => {
    const ctx = canvasRef.current.getContext("2d");
    ctx.clearRect(0, 0, W, H);

    const yMin = 50000, yMax = 800000;
    const toCanvasX = (v) => PAD + ((v - xMin) / (xMax - xMin)) * (W - PAD * 2);
    const toCanvasY = (v) => H - PAD - ((v - yMin) / (yMax - yMin)) * (H - PAD * 2);

    // Grid
    ctx.strokeStyle = "#1E293B";
    ctx.lineWidth = 1;
    for (let i = 0; i <= 4; i++) {
      const y = PAD + (i / 4) * (H - PAD * 2);
      ctx.beginPath(); ctx.moveTo(PAD, y); ctx.lineTo(W - PAD, y); ctx.stroke();
    }

    // Scatter points
    points.forEach(p => {
      const cx = toCanvasX(p.x);
      const cy = toCanvasY(p.y);
      if (cx >= PAD && cx <= W - PAD && cy >= PAD && cy <= H - PAD) {
        ctx.fillStyle = "rgba(59, 130, 246, 0.25)";
        ctx.beginPath(); ctx.arc(cx, cy, 3, 0, Math.PI * 2); ctx.fill();
      }
    });

    // Regression line: vary the selected feature from xMin to xMax,
    // holding all other features at their training-data averages
    const featureIdx = points._featureIdx;
    const trainMeans = [2550, 3, 2.5, 1980]; // avg values from training data generation
    ctx.strokeStyle = "#3B82F6";
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    const buildArgs = (xVal) => trainMeans.map((m, idx) => idx === featureIdx ? xVal : m);
    const regY1 = predict(...buildArgs(xMin));
    const regY2 = predict(...buildArgs(xMax));
    ctx.moveTo(toCanvasX(xMin), toCanvasY(Math.max(yMin, Math.min(yMax, regY1))));
    ctx.lineTo(toCanvasX(xMax), toCanvasY(Math.max(yMin, Math.min(yMax, regY2))));
    ctx.stroke();

    // User point
    const ux = toCanvasX(userX);
    const uy = toCanvasY(Math.max(yMin, Math.min(yMax, userY)));
    // Vertical dashed line
    ctx.setLineDash([4, 4]);
    ctx.strokeStyle = "#F97316";
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(ux, H - PAD); ctx.lineTo(ux, uy); ctx.stroke();
    // Horizontal dashed line
    ctx.beginPath(); ctx.moveTo(PAD, uy); ctx.lineTo(ux, uy); ctx.stroke();
    ctx.setLineDash([]);
    // Point
    ctx.fillStyle = "#F97316";
    ctx.beginPath(); ctx.arc(ux, uy, 7, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#0B1120";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(ux, uy, 7, 0, Math.PI * 2); ctx.stroke();

    // Axes labels
    ctx.fillStyle = "#64748B";
    ctx.font = "11px -apple-system, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(xLabel, W / 2, H - 8);
    // Y axis
    ctx.save();
    ctx.translate(12, H / 2);
    ctx.rotate(-Math.PI / 2);
    ctx.fillText("Price ($)", 0, 0);
    ctx.restore();
    // Tick labels
    ctx.textAlign = "right";
    for (let i = 0; i <= 4; i++) {
      const val = yMin + (i / 4) * (yMax - yMin);
      ctx.fillText("$" + (val / 1000).toFixed(0) + "K", PAD - 5, toCanvasY(val) + 4);
    }
    ctx.textAlign = "center";
    for (let i = 0; i <= 4; i++) {
      const val = xMin + (i / 4) * (xMax - xMin);
      ctx.fillText(Math.round(val).toLocaleString(), toCanvasX(val), H - PAD + 16);
    }

  }, [points, userX, userY, xLabel, xMin, xMax]);

  return <canvas ref={canvasRef} width={W} height={H} style={{ background: "#0F172A" }} />;
}

// ── Coefficient Bar Chart ──
function CoefChart({ features, contributions }) {
  const canvasRef = useRef(null);
  const W = 440, H = 200, PAD = 100;

  useEffect(() => {
    const ctx = canvasRef.current.getContext("2d");
    ctx.clearRect(0, 0, W, H);

    const maxAbs = Math.max(...contributions.map(Math.abs), 1);
    const barH = 28, gap = 12;
    const midX = PAD + (W - PAD - 20) / 2;

    // Zero line
    ctx.strokeStyle = "#334155";
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(midX, 10); ctx.lineTo(midX, H - 10); ctx.stroke();

    const labels = ["Sq. Ft.", "Bedrooms", "Bathrooms", "Year Built"];

    contributions.forEach((c, i) => {
      const y = 16 + i * (barH + gap);
      const barW = (c / maxAbs) * ((W - PAD - 20) / 2 - 10);
      const color = c >= 0 ? "#22C55E" : "#EF4444";

      // Bar
      ctx.fillStyle = color;
      if (c >= 0) {
        ctx.fillRect(midX, y, barW, barH);
      } else {
        ctx.fillRect(midX + barW, y, -barW, barH);
      }

      // Label
      ctx.fillStyle = "#CBD5E1";
      ctx.font = "12px -apple-system, sans-serif";
      ctx.textAlign = "right";
      ctx.fillText(labels[i], PAD - 8, y + barH / 2 + 4);

      // Value
      ctx.fillStyle = color;
      ctx.font = "bold 11px Consolas, monospace";
      ctx.textAlign = c >= 0 ? "left" : "right";
      const valX = c >= 0 ? midX + barW + 5 : midX + barW - 5;
      ctx.fillText((c >= 0 ? "+" : "") + "$" + Math.round(c).toLocaleString(), valX, y + barH / 2 + 4);
    });

    // Zero label
    ctx.fillStyle = "#64748B";
    ctx.font = "10px -apple-system, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("avg", midX, H - 2);

  }, [contributions]);

  return <canvas ref={canvasRef} width={W} height={H} style={{ background: "#0F172A", borderRadius: 8 }} />;
}


function App() {
  const [sqft, setSqft] = useState(1800);
  const [beds, setBeds] = useState(3);
  const [baths, setBaths] = useState(2);
  const [year, setYear] = useState(2005);
  const [scatterFeature, setScatterFeature] = useState(0);

  const price = useMemo(() => predict(sqft, beds, baths, year), [sqft, beds, baths, year]);
  const TRAIN_MEANS = [2550, 3, 2.5, 1980];
  const contributions = useMemo(() => [
    COEFFICIENTS.sqft * (sqft - TRAIN_MEANS[0]),
    COEFFICIENTS.beds * (beds - TRAIN_MEANS[1]),
    COEFFICIENTS.baths * (baths - TRAIN_MEANS[2]),
    COEFFICIENTS.year * (year - TRAIN_MEANS[3]),
  ], [sqft, beds, baths, year]);

  const scatterPoints = useMemo(() => {
    const pts = generateScatter(200, scatterFeature, sqft, beds, baths, year);
    pts._featureIdx = scatterFeature;
    return pts;
  }, [scatterFeature]);

  const featureVals = [sqft, beds, baths, year];
  const scatterRanges = [
    { min: 500, max: 5000, label: "Square Footage" },
    { min: 1, max: 6, label: "Bedrooms" },
    { min: 1, max: 5, label: "Bathrooms" },
    { min: 1920, max: 2025, label: "Year Built" },
  ];

  const sliderDefs = [
    { label: "Square Footage", value: sqft, set: setSqft, min: 600, max: 5000, step: 50, fmt: v => v.toLocaleString() + " sqft" },
    { label: "Bedrooms", value: beds, set: setBeds, min: 1, max: 6, step: 1, fmt: v => v },
    { label: "Bathrooms", value: baths, set: setBaths, min: 1, max: 5, step: 1, fmt: v => v },
    { label: "Year Built", value: year, set: setYear, min: 1920, max: 2025, step: 1, fmt: v => v },
  ];

  return (
    <div style={{ maxWidth: 960, margin: "0 auto", padding: 16 }}>
      {/* Header */}
      <div style={{ textAlign: "center", marginBottom: 16 }}>
        <h1 style={{ fontSize: 32, fontWeight: "bold", marginBottom: 4 }}>Linear Regression Explorer</h1>
        <p style={{ fontSize: 14, color: "#3B82F6" }}>The simplest model — one straight line through the data</p>
      </div>

      {/* Context banner */}
      <div style={{ background: "linear-gradient(135deg, #1A2744, #172554)", border: "1px solid #3B82F6", borderRadius: 12, padding: 20, marginBottom: 20, textAlign: "center" }}>
        <div style={{ fontSize: 20, marginBottom: 6 }}>
          <strong>How Linear Regression Works</strong>
        </div>
        <p style={{ fontSize: 13, color: "#94A3B8", maxWidth: 720, margin: "0 auto", lineHeight: 1.6 }}>
          Linear regression finds <strong style={{ color: "#F8FAFC" }}>one coefficient (weight) for each feature</strong> and an intercept. To make a prediction, it simply multiplies each feature by its coefficient, adds them all up, and adds the intercept. That's it — <strong style={{ color: "#3B82F6" }}>just multiply and add</strong>. There are no hidden layers, no activation functions, no non-linearity. This means it can only learn <strong style={{ color: "#FBBF24" }}>straight-line relationships</strong> between features and price.
        </p>
      </div>

      {/* Frozen bar */}
      <div style={{ background: "#172554", border: "1px solid #3B82F6", borderRadius: 8, padding: "10px 16px", display: "flex", alignItems: "center", justifyContent: "center", gap: 8, marginBottom: 20 }}>
        <span style={{ fontSize: 16 }}>&#128274;</span>
        <span style={{ fontSize: 13, fontWeight: "bold", color: "#3B82F6" }}>COEFFICIENTS ARE FIXED</span>
        <span style={{ fontSize: 12, color: "#94A3B8" }}>— Learned from training data. Changing sliders = new prediction, not new training.</span>
      </div>

      {/* Sliders */}
      <div className="card" style={{ marginBottom: 20 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 4 }}>
          <span style={{ fontSize: 16 }}>&#127968;</span>
          <span style={{ fontSize: 11, fontWeight: "bold", letterSpacing: 2, color: "#3B82F6", textTransform: "uppercase" }}>New House to Predict</span>
        </div>
        <p style={{ fontSize: 12, color: "#64748B", marginBottom: 12 }}>Adjust the features of a house and watch the prediction update instantly.</p>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "12px 24px" }}>
          {sliderDefs.map((s, i) => (
            <div key={i}>
              <div style={{ display: "flex", justifyContent: "space-between", fontSize: 14, marginBottom: 4 }}>
                <span style={{ color: "#CBD5E1" }}>{s.label}</span>
                <span className="mono" style={{ fontWeight: "bold", color: "#60A5FA" }}>{s.fmt(s.value)}</span>
              </div>
              <input
                type="range" min={s.min} max={s.max} step={s.step} value={s.value}
                onChange={e => s.set(Number(e.target.value))}
                style={{ width: "100%", background: `linear-gradient(to right, #3B82F6 ${((s.value - s.min) / (s.max - s.min)) * 100}%, #334155 ${((s.value - s.min) / (s.max - s.min)) * 100}%)` }}
              />
            </div>
          ))}
        </div>
      </div>

      {/* ── STEP 1: THE FORMULA ── */}
      <div className="section">
        <StepBadge num={1} title="The Formula — Multiply and Add" />
        <div className="explain">
          Linear regression is beautifully simple. The model learned <strong>one number (a coefficient) for each feature</strong> during training. To predict a price, it multiplies each feature value by its coefficient, adds them all up, and adds one more number called the <span className="hl">intercept</span> (a baseline starting point).
        </div>
        <div className="explain">
          That's the entire model. No layers, no neurons, no activation functions. Just: <strong>price = (coef₁ × feature₁) + (coef₂ × feature₂) + ... + intercept</strong>.
        </div>
        <div className="callout">
          <strong>The coefficient tells you the rate of change.</strong> A coefficient of <span className="mono" style={{color:"#22C55E"}}>$80/sqft</span> means every additional square foot adds $80 to the predicted price — always, no matter what. That "always, no matter what" is both the strength (simplicity) and the limitation (real life is more complicated).
        </div>

        {/* Formula breakdown */}
        <div className="card" style={{ marginBottom: 16 }}>
          <div style={{ fontSize: 12, color: "#94A3B8", marginBottom: 10, fontWeight: "bold" }}>The complete calculation:</div>
          {COEF_KEYS.map((key, i) => {
            const coef = COEFFICIENTS[key];
            const val = featureVals[i];
            const result = coef * val;
            return (
              <div key={i} style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 6 }} className="mono">
                <span style={{ color: "#94A3B8", width: 90, fontSize: 12, textAlign: "right", fontFamily: "inherit" }}>{FEATURE_NAMES[i]}</span>
                <span style={{ color: "#A78BFA", fontSize: 13 }}>{coef >= 0 ? "+" : ""}{coef.toLocaleString()}</span>
                <span style={{ color: "#64748B" }}>×</span>
                <span style={{ color: "#60A5FA", fontSize: 13 }}>{val.toLocaleString()}</span>
                <span style={{ color: "#64748B" }}>=</span>
                <span style={{ color: result >= 0 ? "#22C55E" : "#EF4444", fontWeight: "bold", fontSize: 13 }}>
                  {result >= 0 ? "+" : ""}${Math.round(result).toLocaleString()}
                </span>
              </div>
            );
          })}
          <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 6, borderTop: "1px solid #334155", paddingTop: 8, marginTop: 4 }} className="mono">
            <span style={{ color: "#94A3B8", width: 90, fontSize: 12, textAlign: "right", fontFamily: "inherit" }}>Intercept</span>
            <span style={{ color: "#A78BFA", fontSize: 13 }}>${COEFFICIENTS.intercept.toLocaleString()}</span>
          </div>
          <div style={{ borderTop: "2px solid #3B82F6", paddingTop: 8, marginTop: 8, display: "flex", alignItems: "center", gap: 8 }}>
            <span style={{ color: "#94A3B8", fontSize: 12 }}>Total =</span>
            <span className="mono" style={{ color: "#F97316", fontWeight: "bold", fontSize: 20 }}>
              ${Math.round(price).toLocaleString()}
            </span>
          </div>
        </div>
        <div className="callout warn-callout">
          <strong>Try it:</strong> Add one bedroom and watch the price jump by exactly $8,000. Add another — another $8,000. It's always the same increment. Linear regression assumes each feature has a constant, additive effect. In reality, a 5th bedroom in a 900 sqft house might actually <em>hurt</em> the price — but linear regression can't capture that.
        </div>
      </div>

      {/* ── STEP 2: CONTRIBUTION CHART ── */}
      <div className="section">
        <StepBadge num={2} title="What's Driving the Price?" />
        <div className="explain">
          Each bar shows <strong>how much a feature pushes the price above or below the average house</strong>. The baseline is a typical training house (~2,550 sqft, 3 beds, 2.5 baths, built ~1980). Bars to the right mean your house scores <strong style={{ color: "#22C55E" }}>above average</strong> on that feature; bars to the left mean <strong style={{ color: "#EF4444" }}>below average</strong>.
        </div>
        <div className="explain">
          This is the key insight: contribution = coefficient × (your value − average value). A feature only moves the price when <strong>your house differs from the average</strong>.
        </div>
        <div style={{ display: "flex", justifyContent: "center" }}>
          <CoefChart features={featureVals} contributions={[...contributions]} />
        </div>
        <div className="callout warn-callout" style={{ marginTop: 12 }}>
          <strong>Try it:</strong> Drag Year Built from 1920 to 2025 — at 1920 the bar is deep red (60 years below average), and at 2025 it swings fully green. Now try Square Footage — moving from 600 to 5,000 sqft creates the biggest swing of all. This tells you which features have the most power to move the price in this model.
        </div>
      </div>

      {/* ── STEP 3: SCATTER PLOT ── */}
      <div className="section">
        <StepBadge num={3} title="Where Does Your House Fall?" />
        <div className="explain">
          The scatter plot below shows <strong>training houses</strong> as blue dots — each one is a real example the model learned from. The blue line is the regression line (the straight-line relationship the model found). Your house is the <strong style={{ color: "#F97316" }}>orange dot</strong>.
        </div>
        <div className="explain">
          Select different features on the X-axis to see the relationship from different angles. Notice how the dots always scatter <em>around</em> a straight line — that's the fundamental assumption of linear regression. If the real relationship is curved, many dots will be far from the line, and the model's predictions will be off.
        </div>
        <div style={{ display: "flex", gap: 8, marginBottom: 12, flexWrap: "wrap" }}>
          {FEATURE_NAMES.map((name, i) => (
            <button key={i} onClick={() => setScatterFeature(i)}
              style={{
                padding: "5px 12px", borderRadius: 8, fontSize: 12, fontWeight: "bold", cursor: "pointer",
                border: `1px solid ${scatterFeature === i ? "#3B82F6" : "#334155"}`,
                background: scatterFeature === i ? "#3B82F6" : "#1A2744",
                color: scatterFeature === i ? "#0B1120" : "#94A3B8",
                transition: "all 0.2s"
              }}>
              {name}
            </button>
          ))}
        </div>
        <div style={{ display: "flex", justifyContent: "center" }}>
          <ScatterPlot
            points={scatterPoints}
            userX={featureVals[scatterFeature]}
            userY={price}
            xLabel={scatterRanges[scatterFeature].label}
            xMin={scatterRanges[scatterFeature].min}
            xMax={scatterRanges[scatterFeature].max}
          />
        </div>
        <div className="callout" style={{ marginTop: 12 }}>
          <strong>What the scatter shows you:</strong> Each dot is one training house. The cloud of dots shows the "noise" in real-world data — houses with the same square footage sell for very different prices. The regression line is the model's best straight-line summary of that noisy cloud. Your orange dot is where your house lands.
        </div>
      </div>

      {/* ── PREDICTION ── */}
      <div className="section" style={{ textAlign: "center" }}>
        <div style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: 2, color: "#94A3B8", marginBottom: 4 }}>Predicted Selling Price</div>
        <div className="mono" style={{ fontSize: 52, fontWeight: "bold", color: "#F97316" }}>
          ${Math.round(price).toLocaleString()}
        </div>
        <div style={{ fontSize: 12, color: "#64748B", marginTop: 4, maxWidth: 600, margin: "8px auto 0" }}>
          A straight-line estimate. Compare this to the Neural Network — which can capture the non-linear patterns linear regression misses.
        </div>
      </div>

      <div style={{ textAlign: "center", marginTop: 20, fontSize: 12, color: "#475569", lineHeight: 1.6, maxWidth: 650, margin: "20px auto 0" }}>
        <strong style={{ color: "#94A3B8" }}>Linear regression is the foundation.</strong> Understanding it makes every other model clearer — because neural networks, decision trees, and random forests are all different answers to the question: "What if straight lines aren't enough?"
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
